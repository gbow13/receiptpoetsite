    <div class="text-content">
      <h2>Response (2025)</h2>
      <p>An acrostic poem written in response to Tesco creating an advertising campaign using their receipts to write acrostic poem a few months after I released my A to Z receipt.</p>

      <p>From £30.00</p>
    </div>
  </main>

  <script>
    let slides = document.querySelectorAll(".slide");
    let currentSlide = 0;

    function showSlide(index) {
      slides.forEach((slide, i) => {
        slide.classList.toggle("active", i === index);
      });
    }

    function nextSlide() {
      currentSlide = (currentSlide + 1) % slides.length;
      showSlide(currentSlide);
    }

    showSlide(currentSlide);
    setInterval(nextSlide, 4000);
  </script>
