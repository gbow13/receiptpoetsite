<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>How the Other Half Lives | The Receipt Poet</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-R94P0B679V"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-R94P0B679V');
</script>

</head>
<body>

  <header>
    <a href="index.html">
      <img src="images/hero.jpg" alt="The Receipt Poet" class="landing-img" />
    </a>
    <div class="social-links">
      <a href="https://instagram.com/thereceiptpoet" target="_blank" aria-label="Instagram">
        <i class="fab fa-instagram"></i>
      </a>
    </div>
  </header>

  <main class="subpage-container">
    <div class="slideshow-container">
      <div class="slide fade">
        <img src="images/Other-half-close.jpg" alt="A to Z Slide 1" />
      </div>
      <div class="slide fade">
        <img src="images/Other-half-close-2.jpg" alt="A to Z Slide 2" />
      </div>
      <div class="slide fade">
        <img src="images/Other-Side-table.jpg" alt="A to Z Slide 3" />
      </div>
    </div>

    <div class="text-content">
      <h2>How the Other Half Lives (2026)</h2>
      <p>6 regualr items bought from 2 different shops seperated by 100 meters on Brompton Road in London.</p>
      <a href="contact.html" class="buy-prints-button">Buy Prints</a>
      <p>From £30.00</p>
    </div>
  </main>

  <script>
    let slides = document.querySelectorAll(".slide");
    let currentSlide = 0;

    function showSlide(index) {
      slides.forEach((slide, i) => {
        slide.classList.toggle("active", i === index);
      });
    }

    function nextSlide() {
      currentSlide = (currentSlide + 1) % slides.length;
      showSlide(currentSlide);
    }

    showSlide(currentSlide);
    setInterval(nextSlide, 4000);
  </script>
  <footer class="footer">
    <a href="index.html" class="home-button">← Back to Home</a>
    <p class="copyright">© 2026 The Receipt Poet. All rights reserved.</p>
  </footer>
</body>
</html>
